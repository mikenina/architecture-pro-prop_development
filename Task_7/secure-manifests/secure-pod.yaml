apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
  namespace: audit-zone
data:
  environment.properties: |
    NODE_ENV=production
    LOG_LEVEL=INFO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-secure-config
  namespace: audit-zone
data:
  nginx.conf: |
    # Конфиг для non-root запуска
    user nginx;
    worker_processes auto;
    
    error_log /dev/stderr;
    
    pid /tmp/nginx.pid;
    
    events {
      worker_connections 1024;
    }
    
    http {
      access_log /dev/stdout;
    
      server {
        listen 8080;
    
        location / {
          return 200 "Ok!\\n";
        }
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: audit-zone
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginx:alpine
      command: [ "nginx" ]
      args: [ "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;" ]
      ports:
        - containerPort: 8080
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add: ["NET_BIND_SERVICE"]
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: cfg-volume
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
  volumes:
    - name: nginx-config
      configMap:
        name: nginx-secure-config
    - name: cfg-volume
      configMap:
        name: test-config
    - name: tmp
      emptyDir: { }
    - name: cache
      emptyDir: { }
