apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: gatekeeper-zone
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-volume
          mountPath: /host-data
  volumes:
    - name: host-volume
      hostPath:
        path: /tmp
        type: Directory